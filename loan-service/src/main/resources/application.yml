spring:
  application:
    name: loan-service
  profiles:
    active: dev
  config:
    import: configserver:http://localhost:8787

  cloud:
    stream:
      default-binder: kafka
      bindings:
        loanCreated-out-0: # output channel
          destination: loan.events.loan-created
          contentType: application/json
      kafka:
        binder:
          brokers: kafka:9092
