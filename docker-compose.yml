
services:
  publishersv_db:
    container_name: publishersv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: publisher_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: publisherservice_db_password
    ports:
      - "5436:5432"
    volumes:
      - publisherdb_vol:/var/lib/postgresql/data

  authorsv_db:
    container_name: authorsv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: author_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: authorservice_db_password
    ports:
      - "5437:5432"
    volumes:
      - authordb_vol:/var/lib/postgresql/data

  membersv_db:
    container_name: membersv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: member_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: memberservice_db_password
    ports:
      - "5438:5432"
    volumes:
      - memberdb_vol:/var/lib/postgresql/data

  booksv_db:
    container_name: booksv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: book_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bookservice_db_password
    ports:
      - "5439:5432"
    volumes:
      - bookdb_vol:/var/lib/postgresql/data

  loansv_db:
    container_name: loansv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: loan_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: loanservice_db_password
    ports:
      - "5440:5432"
    volumes:
      - loandb_vol:/var/lib/postgresql/data

  reservationsv_db:
    container_name: reservationsv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: reservation_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: reservationservice_db_password
    ports:
      - "5441:5432"
    volumes:
      - reservationdb_vol:/var/lib/postgresql/data

  staffsv_db:
    container_name: staffsv_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: staff_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: staffservice_db_password
    ports:
      - "5442:5432"
    volumes:
      - staffdb_vol:/var/lib/postgresql/data
  
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9092:9092"   # container içi (PLAINTEXT) - diğer container'lar için
      - "9094:9094"   # host'tan erişim (EXTERNAL)
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafkanet
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8079:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
    networks:
      - kafkanet
  keycloak_db:
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 3s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    depends_on:
      keycloak_db:
        condition: service_healthy
    command:
      - start-dev
      - --http-port=8585
    ports:
      - "8585:8585"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      
volumes:
  memberdb_vol:
  bookdb_vol:
  authordb_vol:
  staffdb_vol:
  loandb_vol:
  reservationdb_vol:
  publisherdb_vol:
  kafka-data:
  kc_pg_data:

networks:
  kafkanet:
