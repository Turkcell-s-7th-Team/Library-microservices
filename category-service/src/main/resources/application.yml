server:
  port: 8082

spring:
  application:
    name: category-service

  datasource:
    url: jdbc:postgresql://localhost:5443/category_service
    username: postgres
    password: categoryservice_db_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
